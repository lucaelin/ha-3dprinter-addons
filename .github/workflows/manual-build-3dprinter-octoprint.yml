name: Build OctoPrint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "3dprinter-octoprint/**"
      - ".github/workflows/manual-build-3dprinter-octoprint.yml"
  pull_request:
    paths:
      - "3dprinter-octoprint/**"
      - ".github/workflows/manual-build-3dprinter-octoprint.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build OctoPrint (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-24.04-arm
          - arch: armhf
            platform: linux/arm/v6
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Read build configuration
        id: config
        run: |
          echo "version=$(yq -r '.version' 3dprinter-octoprint/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=$(yq -r '.image' 3dprinter-octoprint/config.yaml | sed 's/{arch}/${{ matrix.arch }}/')" >> "$GITHUB_OUTPUT"
          echo "base=$(yq -r '.build_from.${{ matrix.arch }}' 3dprinter-octoprint/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "octoprint=$(yq -r '.args.OCTOPRINT_VERSION' 3dprinter-octoprint/build.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armv7' || matrix.arch == 'armhf'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./3dprinter-octoprint
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.config.outputs.image }}:${{ steps.config.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.config.outputs.base }}
            OCTOPRINT_VERSION=${{ steps.config.outputs.octoprint }}
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.config.outputs.version }}
            io.hass.name=3DPrinter-OctoPrint
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=octoprint-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=octoprint-${{ matrix.arch }}
